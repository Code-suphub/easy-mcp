name: Publish

# 发布方式：直接 HTTP PUT 到 npm registry（scripts/publish-direct.mjs）。
# 背景：npm publish 客户端对 @easy-mcps/* 的发布请求会被 npm 前端（Cloudflare WAF）
# 拦截返回 403（客户端把 HTML 折叠成通用 403），而相同 token 直接 PUT 可成功。
#
# 前置条件：
#   在 GitHub Secrets 中配置 NPM_TOKEN（npm automation/granular token，
#   账号 a54983334 已开启 2FA，auth-and-writes）。
on:
  workflow_dispatch:
    inputs:
      packages:
        description: 要发布的包（逗号分隔，如 redis,postgresql；或 all 发布全部）
        required: true
        default: all
      bump:
        description: 版本递增类型
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write # 提交版本号回仓库
  id-token: write # Trusted Publishing 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch 默认检出为 detached HEAD，指定分支才能 push 回去
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing 要求 Node >= 22.14.0、npm >= 11.5.1
          node-version: 24
          registry-url: https://registry.npmjs.org
          # 发布构建不使用缓存，确保依赖来源干净
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm test

      - name: Resolve targets
        id: targets
        run: |
          ALL="mysql postgresql clickhouse sqlite tidb oceanbase mariadb starrocks redis"
          INPUT="${{ inputs.packages }}"
          if [ "$INPUT" = "all" ]; then
            echo "list=$ALL" >> "$GITHUB_OUTPUT"
          else
            echo "list=$(echo "$INPUT" | tr ',' ' ')" >> "$GITHUB_OUTPUT"
          fi

      # 验证 token 认证是否生效
      - name: Verify npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Token 长度: ${#NODE_AUTH_TOKEN}"
          if npm whoami 2>&1; then
            echo "npm 认证成功"
          else
            echo "::error::npm 认证失败，请检查 NPM_TOKEN"
          fi
          # 检查 .npmrc 内容（脱敏）
          echo "--- .npmrc ---"
          sed 's/:_authToken=.*/:_authToken=***/' "$NPM_CONFIG_USERCONFIG" 2>/dev/null || echo "(无 .npmrc)"

      # npm 认证：通过 NODE_AUTH_TOKEN 提供 token（优先级高于 OIDC），
      # OIDC（id-token: write）仍用于 provenance 签名。
      # 如果 NPM_TOKEN 未配置则回退到纯 OIDC（仅 redis 包当前可用）。
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning title=no-npm-token::NPM_TOKEN secret 未配置，仅 OIDC 可用（已知 redis 以外 8 个包 OIDC 有 registry bug 会 403）"
          else
            echo "NPM_TOKEN 已配置 (长度=${#NODE_AUTH_TOKEN})，将使用 token 认证"
          fi

          npm run sync
          FAILED=""
          OK=""
          for p in ${{ steps.targets.outputs.list }}; do
            echo "::group::publish $p"
            if (
              set -e
              cd "$p-mcp"
              npm version ${{ inputs.bump }} --no-git-tag-version
              npm run build
              node "$GITHUB_WORKSPACE/scripts/publish-direct.mjs" "$GITHUB_WORKSPACE/$p-mcp"
            ); then
              OK="$OK $p"
            else
              FAILED="$FAILED $p"
              echo "::error title=publish failed::$p 发布失败"
              git checkout -- "$p-mcp/package.json" || true
            fi
            echo "::endgroup::"
          done

          {
            echo "## 发布结果"
            echo ""
            echo "- 成功:${OK:- 无}"
            echo "- 失败:${FAILED:- 无}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "成功:${OK:- 无}"
          echo "失败:${FAILED:- 无}"
          [ -z "$FAILED" ]

      # 即使部分包发布失败也提交已完成的版本号，避免本地与 registry 漂移
      - name: Commit version bumps
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./*/package.json package-lock.json
          git diff --staged --quiet || {
            git commit -m "chore: 发布版本号递增 [skip ci]"
            git push
          }
